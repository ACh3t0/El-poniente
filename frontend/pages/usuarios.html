<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios | Carbón El Poniente</title>
    <link rel="stylesheet" href="./main.css">
    <link rel="stylesheet" href="./operaciones.css">
    <link rel="stylesheet" href="./usuarios.css">
</head>
<body>
    <nav class="sidebar">
        <div class="marca"><strong>EL PONIENTE</strong><span>Sistema de Gesti&oacute;n</span></div>
        <ul>
            <li><a href="./main.html">Inicio</a></li>
            <li><a href="./inventario.html">Inventario</a></li>
            <li><a href="./usuarios.html" aria-current="page">Usuarios</a></li>
            <li><a href="./ventas.html">Ventas</a></li>
            <li><a href="./reportes.html">Reportes</a></li>
        </ul>
    </nav>

    <main>
        <header class="encabezado">
            <h1>Administraci&oacute;n de Usuarios y Permisos por Rol</h1><div id="sesion-cabecera" class="sesion-cabecera"></div>
        </header>

        <section id="dialogo" class="panel panel-registro" aria-labelledby="titulo-dialogo">
            <form id="formulario">
                <h2 id="titulo-dialogo">Registrar Nuevo Usuario del Sistema</h2>

                <label for="usuario">Correo / Usuario</label>
                <input id="usuario" type="text" maxlength="50" required autocomplete="off">

                <label for="tipo">Rol asignado</label>
                <select id="tipo">
                    <option value="1">Empleado (vendedor)</option>
                    <option value="2">Administrador</option>
                    <option value="3" id="opcion-dev">Encargado de producción</option>
                </select>

                <label for="password">Contraseña</label>
                <input id="password" type="password" minlength="8" maxlength="128" autocomplete="new-password">
                <small id="ayuda-password"></small>

                <p id="error-form" class="error" role="alert"></p>

                <div class="botones-form">
                    <button type="submit">+ Guardar Usuario</button>
                    <button type="button" id="btn-cancelar" class="secundario">Limpiar / Cancelar edici&oacute;n</button>
                </div>
            </form>
        </section>
        <p id="mensaje" role="status" hidden></p>

        <section class="panel"><div class="directorio-titulo"><h2>Personal Registrado en el Sistema</h2><button id="btn-nuevo" type="button">Nuevo usuario</button></div><div class="tabla-contenedor">
            <table>
                <thead>
                    <tr>
                        <th>ID</th><th>Correo / Usuario</th>
                        <th>Tipo de cuenta</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-usuarios"></tbody>
            </table>
        </div></section>


    </main>

    <script type="module" src="./usuarios.js"></script>
</body>
</html>
