<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compras de materia prima | Carbón El Poniente</title><link rel="stylesheet" href="main.css"><link rel="stylesheet" href="operaciones.css"></head>
<body class="page-compras"><nav class="sidebar"><div class="marca"><strong>EL PONIENTE</strong><span>Sistema de Gesti&oacute;n</span></div><ul></ul></nav><main>
<header class="encabezado"><div><h1>Gesti&oacute;n de Compras de Materia Prima</h1><p>Registra las entradas de insumos y su costo.</p></div><div id="sesion-cabecera" class="sesion-cabecera"></div></header>
<p id="mensaje" role="status" aria-live="polite" hidden></p>
<section class="panel"><h2>Registrar Nueva Entrada de Materia Prima</h2><form id="operacion" class="rejilla"><div class="campo"><label for="materia">Materia prima</label><select id="materia" required></select></div><div class="campo"><label for="proveedor">Proveedor</label><input id="proveedor" type="text" maxlength="150" required></div><div class="campo"><label for="cantidad">Cantidad comprada (unidad del insumo)</label><input id="cantidad" type="number" min="1" step="1" required></div><div class="campo"><label for="costo">Costo total ($)</label><input id="costo" type="number" min="0" step="0.01" required></div><button type="submit">+ Registrar Compra</button></form></section><section class="panel"><h2>Historial de Compras Registradas</h2><div class="tabla-contenedor"><table><thead><tr><th>Folio</th><th>Fecha</th><th>Proveedor</th><th>Materia prima</th><th>Cantidad</th><th>Costo total</th><th>Responsable</th></tr></thead><tbody id="historial"></tbody></table></div></section>
</main><script type="module" src="operaciones.js"></script></body></html>
