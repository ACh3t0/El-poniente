<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Productos | Carbón El Poniente</title><link rel="stylesheet" href="main.css"><link rel="stylesheet" href="operaciones.css"></head>
<body class="page-productos"><nav class="sidebar"><div class="marca"><strong>EL PONIENTE</strong><span>Sistema de Gesti&oacute;n</span></div><ul></ul></nav><main>
<header class="encabezado"><div><h1>Productos</h1><p>Administra el catálogo de materia prima y productos terminados.</p></div><div id="sesion-cabecera" class="sesion-cabecera"></div></header>
<p id="mensaje" role="status" aria-live="polite" hidden></p>
<section class="panel"><h2 id="titulo-form">Nuevo producto</h2><form id="producto-form" class="rejilla"><div class="campo"><label for="nombre">Nombre</label><input id="nombre" type="text" maxlength="100" required></div><div class="campo"><label for="tipo">Tipo de inventario</label><select id="tipo"><option value="Terminado">Producto terminado</option><option value="Materia prima">Materia prima</option></select></div><div class="campo"><label for="unidad">Unidad (kg, pieza, litro…)</label><input id="unidad" type="text" maxlength="20" value="kg" required></div><div class="campo"><label for="precio">Precio de venta por unidad ($)</label><input id="precio" type="number" min="0" step="0.01" value="0" required></div><div class="campo"><label for="minimo">Stock mínimo</label><input id="minimo" type="number" min="0" step="1" value="0" required></div><div class="campo"><label for="descripcion">Descripción</label><input id="descripcion" type="text" maxlength="255"></div><label><input id="activo" type="checkbox" checked> Activo</label><p class="ayuda">Las existencias se gestionan desde Compras, Producción o los ajustes de Inventario.</p><div><button type="submit">Guardar producto</button> <button id="cancelar" type="button">Cancelar edición</button></div></form></section><section class="panel"><h2>Catálogo</h2><div class="tabla-contenedor"><table><thead><tr><th>Nombre</th><th>Tipo</th><th>Unidad</th><th>Existencia</th><th>Precio</th><th>Estado</th><th>Acción</th></tr></thead><tbody id="catalogo"></tbody></table></div></section>
</main><script type="module" src="productos.js"></script></body></html>
