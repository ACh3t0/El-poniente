<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carbón El Poniente</title>
    <link rel="stylesheet" href="login.css">
    <script type="module" src="./login.js"></script>
</head>
<body>
    <main class="cardContent" aria-labelledby="login-title">
        <header class="cardHeader">
            <div class="brandMark" aria-hidden="true">EP</div>
            <h1 class="title" id="login-title">Carbón El Poniente</h1>
            <p class="subtitle">Sistema de Gestión de Inventario, Producción y Ventas</p>
        </header>

        <form id="loginForm">
            <div class="formsCard">
                <div class="formField">
                    <label class="userName" for="userName">Nombre de usuario</label>
                    <input type="text" id="userName" name="userName" autocomplete="username" required>
                </div>
                <div class="formField">
                    <label class="password" for="password">Contraseña</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>
                <div class="formField">
                    <label class="accountType" for="accountType">Tipo de cuenta</label>
                    <select class="foldingMenu" id="accountType" name="accountType">
                        <option value="1">Empleado (vendedor)</option>
                        <option value="2">Administrador</option>
                        <option value="3">Encargado de producción</option>
                    </select>
                </div>
            </div>
            <div class="buttonContainer">
                <button type="submit" class="loginBox">Iniciar sesión</button>
                <button type="button" class="register" onclick="window.location.href = 'register.html'">Registrar usuario</button>
            </div>
        </form>

        <footer class="cardFooter">
            <p>Acceso exclusivo para personal autorizado.</p>
            <p>Versión 1.0</p>
        </footer>
    </main>
</body>
</html>
